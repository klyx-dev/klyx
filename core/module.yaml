product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

apply:
  - //common.module-template.yaml
  - //test.module-template.yaml

settings:
  junit: junit-5
  compose:
    resources: 
      packageName: com.klyx.resources
      nameOfResClass: Resources
      exposedAccessors: true
  kotlin:
    compilerPlugins:
      - id: io.insert-koin.compiler.plugin
        dependency: io.insert-koin:koin-compiler-plugin:1.2.1

dependencies:
  - $compose.foundation
  - bom: $libs.koin.bom
  - $libs.koin.core: exported
  - $libs.koin.annotations: exported
  - $libs.compose.material3.adaptive: exported
  - $libs.kotlinx.coroutines.core: exported
  - $libs.filekit.dialogs: exported

test-settings:
  kotlin:
    freeCompilerArgs: [ -XXLanguage:+NameBasedDestructuring ]
