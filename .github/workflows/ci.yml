name: Android CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "**/*.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "Klyx"
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Make Kotlin executable
        run: chmod +x ./kotlin

      - name: Restore signing files
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KLYX_KEYSTORE }}" | base64 -d > /tmp/klyx.keystore
          echo "${{ secrets.KEYSTORE_PROP }}" | base64 -d > android-app/sign.properties
          sed -i 's|^storeFile=.*|storeFile=/tmp/klyx.keystore|' android-app/sign.properties

      - name: Build APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./kotlin build --variant debug
          else
            ./kotlin build --variant release
          fi

      - name: Prepare APK
        id: apk
        run: |
          mkdir -p artifacts

          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            APK="build/tasks/_android-app_buildAndroidDebug/gradle-project-debug.apk"
          else
            APK="build/tasks/_android-app_buildAndroidRelease/gradle-project-release.apk"
          fi

          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            echo "Available APKs:"
            find build -type f -name "*.apk" -print
            exit 1
          fi

          OUTPUT="artifacts/klyx-${SHORT_SHA}.apk"
          cp "$APK" "$OUTPUT"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] &&
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then

            COMMIT_MSG="$(git log \
              ${{ github.event.before }}..${{ github.sha }} \
              --pretty=format:"%s by %an" \
              --reverse)"
          else
            COMMIT_MSG="$(git log -1 --pretty=format:"%s by %an")"
          fi

          CAPTION=$(echo "$COMMIT_MSG" | head -c 1000)

          if [ "${#COMMIT_MSG}" -gt 1000 ]; then
            CAPTION="${CAPTION}..."
          fi

          curl -s \
            --fail \
            --show-error \
            -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F message_thread_id="${TOPIC_ID}" \
            -F document=@"${{ steps.apk.outputs.apk }}" \
            -F caption="${CAPTION}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: klyx-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 15
          if-no-files-found: error

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /tmp/klyx.keystore
          rm -f /tmp/sign.properties
          rm -f android-app/sign.properties
