name: Android CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "**/*.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  APP_NAME: "Klyx"
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

  KOTLIN_SHARED_CACHE_DIR: /home/runner/.cache/JetBrains/Kotlin
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Make Kotlin executable
        run: chmod +x ./kotlin

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/JetBrains/Kotlin
          key: ${{ runner.os }}-kotlin-${{ hashFiles('kotlin') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-

      - name: Restore signing files
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KLYX_KEYSTORE }}
          KEYSTORE_PROP_B64: ${{ secrets.KEYSTORE_PROP }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/klyx.keystore
          echo "$KEYSTORE_PROP_B64" | base64 -d > android-app/sign.properties
          sed -i 's|^storeFile=.*|storeFile=/tmp/klyx.keystore|' android-app/sign.properties

      - name: Build APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./kotlin build --variant debug
          else
            ./kotlin build --variant release
          fi

      - name: Prepare APK
        id: apk
        run: |
          mkdir -p artifacts

          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            APK="build/tasks/_android-app_buildAndroidDebug/gradle-project-debug.apk"
          else
            APK="build/tasks/_android-app_buildAndroidRelease/gradle-project-release.apk"
          fi

          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            echo "Available APKs:"
            find build -type f -name "*.apk" -print
            exit 1
          fi

          OUTPUT="artifacts/klyx-${SHORT_SHA}.apk"
          cp "$APK" "$OUTPUT"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_BEFORE: ${{ github.event.before }}
          APK_PATH: ${{ steps.apk.outputs.apk }}
          SHORT_SHA: ${{ steps.apk.outputs.short_sha }}
        run: |
          set -euo pipefail

          SHA="$GITHUB_SHA"
          ZERO="0000000000000000000000000000000000000000"
          API="https://api.telegram.org/bot${TOKEN}"
          MAX_CHUNK=3500
          MAX_BODY=2500
          SEP=$'\n\n------------\n\n'

          valid_base() {
            [ -n "${1:-}" ] && [ "$1" != "$ZERO" ] &&
            git cat-file -e "$1^{commit}" 2>/dev/null &&
            git merge-base --is-ancestor "$1" "$SHA" 2>/dev/null &&
            [ "$1" != "$SHA" ]
          }

          BASE="$(gh run list \
            --workflow "$WORKFLOW_NAME" \
            --branch main \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // empty' 2>/dev/null || true)"

          if ! valid_base "$BASE"; then
            BASE="$EVENT_BEFORE"
          fi

          COMMITS=()
          if valid_base "$BASE"; then
            mapfile -d '' -t COMMITS < <(git log -z --no-merges --reverse --pretty=format:'%B' "$BASE..$SHA")
          fi
          if [ "${#COMMITS[@]}" -eq 0 ]; then
            mapfile -d '' -t COMMITS < <(git log -z -1 --pretty=format:'%B' "$SHA")
          fi

          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          format_commit() {
            local raw subject body out

            raw="$(printf '%s\n' "$1" | grep -viE '^(signed-off-by|co-authored-by):' || true)"
            raw="$(printf '%s\n' "$raw" | sed '/./,$!d')"

            subject="$(printf '%s\n' "$raw" | head -n 1)"
            body="$(printf '%s\n' "$raw" | tail -n +2 | sed '/./,$!d')"

            if [ "${#body}" -gt "$MAX_BODY" ]; then
              body="${body:0:$MAX_BODY}…"
            fi

            out="<b>$(printf '%s' "$subject" | esc)</b>"
            if [ -n "$body" ]; then
              out+=$'\n\n'"$(printf '%s' "$body" | esc)"
            fi
            printf '%s' "$out"
          }

          CHUNKS=()
          CUR=""
          for raw in "${COMMITS[@]}"; do
            part="$(format_commit "$raw")"
            if [ -z "$CUR" ]; then
              CUR="$part"
            elif [ $(( ${#CUR} + ${#SEP} + ${#part} )) -gt "$MAX_CHUNK" ]; then
              CHUNKS+=("$CUR")
              CUR="$part"
            else
              CUR+="${SEP}${part}"
            fi
          done
          CHUNKS+=("$CUR")

          TOTAL="${#COMMITS[@]}"
          CHUNKS[0]="<b>Changes (${TOTAL})</b>"$'\n\n'"${CHUNKS[0]}"

          THREAD=()
          if [ -n "${TOPIC_ID:-}" ]; then
            THREAD=(-F message_thread_id="$TOPIC_ID")
          fi

          CAPTION="<b>Klyx build</b> · <code>${SHORT_SHA}</code>"

          RESPONSE="$(curl -sS \
            --fail-with-body \
            -X POST "${API}/sendDocument" \
            -F chat_id="$CHAT_ID" \
            "${THREAD[@]}" \
            -F document=@"$APK_PATH" \
            -F parse_mode=HTML \
            -F caption="$CAPTION")"

          DOC_ID="$(jq -r '.result.message_id' <<< "$RESPONSE")"

          for chunk in "${CHUNKS[@]}"; do
            curl -sS \
              --fail-with-body \
              -X POST "${API}/sendMessage" \
              -F chat_id="$CHAT_ID" \
              "${THREAD[@]}" \
              -F reply_to_message_id="$DOC_ID" \
              -F allow_sending_without_reply=true \
              -F parse_mode=HTML \
              -F disable_web_page_preview=true \
              --form-string text="$chunk" > /dev/null
            sleep 1
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: klyx-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 15
          if-no-files-found: error

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /tmp/klyx.keystore
          rm -f android-app/sign.properties
