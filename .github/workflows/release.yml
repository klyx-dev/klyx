name: Alpha Release

on:
  push:
    tags: [ "[0-9]*" ]

  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0-alpha.2"
        required: true

permissions:
  contents: write

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release:
    name: Build and publish alpha
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.KLYX_KEYSTORE }}
          KEYSTORE_PROP_B64: ${{ secrets.KEYSTORE_PROP }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > /tmp/klyx.keystore
          echo "$KEYSTORE_PROP_B64" | base64 -d > app/android/sign.properties
          sed -i 's|^storeFile=.*|storeFile=/tmp/klyx.keystore|' app/android/sign.properties

      - name: Build versioned release APKs
        run: |
          set -euo pipefail

          case "$VERSION" in
            *[!0-9A-Za-z._-]*)
              echo "Invalid version: $VERSION"
              exit 1
              ;;
          esac

          CODE=$((1000 + GITHUB_RUN_NUMBER))

          ./gradlew :app:android:assembleRelease "-PklyxVersionCode=$CODE" "-PklyxVersionName=$VERSION"

      - name: Prepare assets
        run: |
          set -euo pipefail

          mkdir -p artifacts
          for flavor in classic m3; do
            cp "app/android/build/outputs/apk/$flavor/release/android-$flavor-release.apk" \
              "artifacts/klyx-${VERSION}-$flavor.apk"
          done

          cd artifacts
          sha256sum *.apk > SHA256SUMS
          ls -lh

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APKS=(artifacts/*.apk)
          SUMS="artifacts/SHA256SUMS"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${APKS[@]}" "$SUMS" --clobber
            gh release edit "$VERSION" \
              --title "Klyx $VERSION" \
              --prerelease
          else
            gh release create "$VERSION" "${APKS[@]}" "$SUMS" \
              --title "Klyx $VERSION" \
              --generate-notes \
              --prerelease
          fi
