product: android/app

dependencies:
  - //app
  - $libs.androidx.activity.compose
  - bom: $libs.koin.bom
  - $libs.koin.android
  - $libs.filekit.dialogs
  - $kotlin.serialization.json

settings:
  android:
    namespace: "com.klyx"
    applicationId: "com.klyx"

    versionCode: 1
    versionName: "0.1.0-alpha.1"

    abiFilters: [ arm64-v8a, x86_64 ]
    signing:
      enabled: true
      propertiesFile: ./sign.properties
  junit: junit-5
  kotlin: 
    serialization:
      enabled: true
      version: 1.12.0

apply:
  - //common.module-template.yaml
  - //koin.module-template.yaml
