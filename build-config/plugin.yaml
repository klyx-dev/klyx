tasks:
  generate:
    action: !com.klyx.build.generateSources
      propertiesFile: ${project.rootDir}/${pluginSettings.propertiesFileName}.properties
      generatedSourceDir: ${taskOutputDir}

  generateBuildInfo:
    action: !com.klyx.build.generateBuildInfo
      projectRoot: ${project.rootDir}
      outputDir: ${taskOutputDir}

generated:
  sources:
    - language: kotlin
      directory: ${tasks.generate.action.generatedSourceDir}
    - language: kotlin
      directory: ${tasks.generateBuildInfo.action.outputDir}
