[versions]
koin = "4.2.2"
kotest = "6.2.5"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.1"

[libraries]
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-annotations = { module = "io.insert-koin:koin-annotations" }
koin-compose = { module = "io.insert-koin:koin-compose" }

kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }

kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }

compose-material3-adaptive = "org.jetbrains.compose.material3.adaptive:adaptive:1.3.0-rc01"

composeunstyled = "com.composables:composeunstyled:2.10.0"
navigation3-ui = "org.jetbrains.androidx.navigation3:navigation3-ui:1.1.2"

okio = "com.squareup.okio:okio:3.18.2"
